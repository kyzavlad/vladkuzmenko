name: Production visual audit v2

on:
  push:
    branches:
      - qa/production-visual-audit-20260815

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run production visual audit
        env:
          BASE_URL: https://vladkuzmenko.com
        run: node scripts/production-visual-audit.mjs
      - name: Run production internal-link audit
        env:
          BASE_URL: https://vladkuzmenko.com
        run: node scripts/production-link-audit.mjs
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-site-visual-audit
          path: site-audit-artifact
          if-no-files-found: warn
          retention-days: 14
