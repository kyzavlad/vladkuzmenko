name: Website Release Quality

on:
  push:
    branches:
      - main
      - "site-finish-*"
      - "visibilityos-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint release surface
        run: |
          npx eslint \
            components/home/Hero.tsx \
            components/home/EcosystemCore.tsx \
            components/home/EcosystemNavigator.tsx \
            components/home/VisibilitySection.tsx \
            components/home/WarriorsSection.tsx \
            components/home/DropSection.tsx \
            components/home/PersonalBrand.tsx \
            components/home/HomeContent.tsx \
            components/home/ContactSection.tsx \
            components/FooterSection.tsx \
            components/business/BusinessPortfolioSection.tsx \
            components/ui/header.tsx \
            components/ui/page-depth-section.tsx \
            components/ui/legacy-redirect.tsx \
            components/ui/direction-page-hero.tsx \
            components/pages/VisibilityOsPage.tsx \
            components/pages/VisibilityOsPremiumPage.tsx \
            components/pages/VisibilityOsMarketPageV3.tsx \
            components/pages/VisibilityOsAppPage.tsx \
            components/pages/WarriorsTeamPage.tsx \
            components/pages/DropPage.tsx \
            lib/directions.ts \
            lib/portfolio-curated.ts \
            lib/portfolio-schema.ts \
            lib/visibilityos-scan.ts \
            lib/visibilityos-client.ts \
            app/api/visibilityos/scan/route.ts \
            app/api/visibilityos/health/route.ts \
            app/visibilityos/page.tsx \
            app/visibilityos/app/page.tsx \
            app/ua/visibilityos/page.tsx \
            app/ua/visibilityos/app/page.tsx \
            app/ru/visibilityos/page.tsx \
            app/ru/visibilityos/app/page.tsx \
            app/layout.tsx \
            app/robots.ts \
            app/sitemap.ts \
            middleware.ts \
            app/not-found.tsx

      - name: Validate server-native monitoring source
        shell: bash
        run: |
          test -f supabase/functions/visibilityos-monitor-worker/index.ts
          grep -q 'visibilityos_claim_due_jobs' supabase/functions/visibilityos-monitor-worker/index.ts
          grep -q 'visibilityos_record_automation_callback' supabase/functions/visibilityos-monitor-worker/index.ts
          grep -q 'visibilityos_verify_cron_secret' supabase/functions/visibilityos-monitor-worker/index.ts
          test -f supabase/migrations/20260818102000_visibilityos_explicit_verify_runs_v2.sql
          grep -q 'visibilityos_record_user_scan_v2' supabase/migrations/20260818102000_visibilityos_explicit_verify_runs_v2.sql

      - name: Typecheck with known-debt guard
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log

          if [ "$status" -eq 0 ]; then
            echo "Typecheck is fully clean."
            exit 0
          fi

          error_count=$(grep -c "error TS" /tmp/tsc.log || true)
          unexpected=$(grep "error TS" /tmp/tsc.log | grep -v "components/pages/PortfolioShowcaseCasePage.tsx" || true)

          if [ "$error_count" -ne 2 ] || [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript error set. Expected exactly the 2 known PortfolioShowcaseCasePage.tsx errors."
            exit 1
          fi

          echo "Only the 2 pre-existing PortfolioShowcaseCasePage.tsx errors remain; no new TypeScript errors detected."

      - name: Production runtime build
        run: npm run build

      - name: Validate runtime product build
        shell: bash
        run: |
          test -f .next/BUILD_ID
          test -f .next/server/app-paths-manifest.json
          grep -q 'api/visibilityos/scan' .next/server/app-paths-manifest.json
          grep -q 'api/visibilityos/health' .next/server/app-paths-manifest.json
          grep -q 'visibilityos/app' .next/server/app-paths-manifest.json
          grep -q 'visibilityos' .next/server/app-paths-manifest.json
          grep -q 'robots.txt' .next/server/app-paths-manifest.json
          grep -q 'sitemap.xml' .next/server/app-paths-manifest.json
          test -f .next/server/middleware-manifest.json

      - name: Reject retired positioning on changed release surfaces
        shell: bash
        run: |
          files=(
            components/home/Hero.tsx
            components/home/EcosystemCore.tsx
            components/home/EcosystemNavigator.tsx
            components/home/VisibilitySection.tsx
            components/pages/VisibilityOsPremiumPage.tsx
            components/pages/VisibilityOsMarketPageV3.tsx
          )
          if grep -E "Собственные продукты, а не клиентские проекты|Власні продукти, а не клієнтські проєкти|AI-системы для бизнеса|AI-системи для бізнесу" "${files[@]}"; then
            echo "Retired positioning leaked into a current release surface."
            exit 1
          fi

      - name: Reject retired VisibilityOS beta claims
        shell: bash
        run: |
          files=(
            components/pages/VisibilityOsMarketPageV3.tsx
            app/visibilityos/page.tsx
            app/ua/visibilityos/page.tsx
            app/ru/visibilityos/page.tsx
          )
          if grep -Ei "monitoring beta|join beta|join monitoring beta|приєднатись до monitoring beta|присоединиться к monitoring beta" "${files[@]}"; then
            echo "VisibilityOS is live; beta positioning must not appear on current public routes."
            exit 1
          fi
